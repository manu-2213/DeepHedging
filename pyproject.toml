[project]
name = "deep-hedging"
version = "0.1.0"
description = "The Value of Not Acting: deep hedging with an inaction network (hedging engine and the paper's experiments)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "scipy>=1.15.2",
    "optuna>=4.0",
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
]

[project.optional-dependencies]
calibration = ["quantlib==1.41", "yfinance"]
